name: Publish pinned Agent Release

# One reviewed pin change on main triggers the release; ordinary source pushes
# and CI completion cannot publish. Manual dispatch also supports existing pins.
on:
  push:
    branches: [main]
    paths:
      - '.github/release-pins/*.json'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Pinned reviewed three- or five-platform release tag
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout reviewed publishing manifest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release pin from main push or dispatch
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EVENT" == push ]]; then
            mapfile -t pins < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '.github/release-pins/*.json')
            if (( ${#pins[@]} != 1 )); then
              echo "A main push must change exactly one release pin" >&2
              exit 1
            fi
            tag="${pins[0]##*/}"
            tag="${tag%.json}"
          else
            tag="$RELEASE_TAG_INPUT"
          fi
          if [[ ! "$tag" =~ ^v0\.[1-9][0-9]*\.[0-9]+(-[a-z0-9][a-z0-9.-]*)?$ ]]; then
            echo "Invalid reviewed release tag" >&2
            exit 1
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"

      - name: Verify candidate and signed-off source
        shell: bash
        run: |
          set -euo pipefail
          pin=".github/release-pins/$RELEASE_TAG.json"
          test -f "$pin"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag == $tag and
            (.source_sha | test("^[a-f0-9]{40}$")) and
            (.candidate_run_id | type == "number") and
            (([.assets[].target] == ["linux-x64-glibc", "linux-arm64-glibc", "windows-x64"] and
              (.assets | length == 3) and (.macos_script_sha256 == null)) or
             ([.assets[].target] == ["linux-x64-glibc", "linux-arm64-glibc", "windows-x64", "darwin-arm64", "darwin-x64"] and
              (.assets | length == 5) and
              (.macos_script_sha256 | type == "string" and test("^[a-f0-9]{64}$")))) and
            ([.assets[] |
              (.sha256 | test("^[a-f0-9]{64}$")) and
              (.name == ("remote-control-agent-" + $tag + "-" + .target +
                (if .target == "windows-x64" then ".zip" else ".tar.gz" end))) and
              (.artifact == ($tag + "-" +
                (if .target == "windows-x64" then "windows-x64" else
                (if .target == "linux-x64-glibc" then "ubuntu-24.04"
                 elif .target == "linux-arm64-glibc" then "ubuntu-24.04-arm"
                 elif .target == "darwin-arm64" then "darwin-arm64"
                 else "darwin-x64" end) end)))
             ] | all)
          ' "$pin" >/dev/null
          sha="$(jq -r .source_sha "$pin")"
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          # Five-platform pin also fixes the exact local owner bootstrap source.
          if [[ "$(jq -r '.assets | length' "$pin")" == 5 ]]; then
            source_digest="$(git show "$sha:apps/remote-control-agent/scripts/macos-local.sh" | sha256sum | cut -d' ' -f1)"
            test "$source_digest" = "$(jq -r .macos_script_sha256 "$pin")"
          fi
          run_id="$(jq -r .candidate_run_id "$pin")"
          gh api "repos/$GH_REPO/actions/runs/$run_id" |
            jq -e --arg sha "$sha" '
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_sha == $sha and
              .status == "completed" and
              .conclusion == "success"
            ' >/dev/null
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]] ||
             gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release/tag may not be overwritten" >&2
            exit 1
          fi

      - name: Fetch and verify exactly three or five pinned native candidates
        shell: bash
        run: |
          set -euo pipefail
          pin=".github/release-pins/$RELEASE_TAG.json"
          run_id="$(jq -r .candidate_run_id "$pin")"
          mkdir -p "$RUNNER_TEMP/publish"
          count="$(jq -r '.assets | length' "$pin")"
          for ((i=0;i<count;i++)); do
            target="$(jq -r ".assets[$i].target" "$pin")"
            artifact="$(jq -r ".assets[$i].artifact" "$pin")"
            filename="$(jq -r ".assets[$i].name" "$pin")"
            digest="$(jq -r ".assets[$i].sha256" "$pin")"
            output="$RUNNER_TEMP/candidates/$target"
            mkdir -p "$output"
            gh run download "$run_id" --name "$artifact" --dir "$output"
            if [[ "$target" == windows-x64 || "$target" == darwin-* ]]; then
              archive="$output/$filename"
              record="$output/SHA256SUMS.txt"
            else
              archive="$output/$target/$filename"
              record="$output/$target/SHA256SUMS.txt"
            fi
            test -f "$archive" && test ! -L "$archive"
            test -f "$record" && test ! -L "$record"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status
            if [[ "$target" == windows-x64 ]]; then
              # Windows PowerShell produces a CRLF checksum manifest.
              # Normalize *only* the record ending; retain exact SHA/name checks.
              sed 's/\r$//' "$record" | grep -Fx "$digest  $filename" >/dev/null
              unzip -tq "$archive" >/dev/null
              unzip -p "$archive" bundle.json | jq -e \
                --arg version "$RELEASE_TAG" --arg target "$target" '
                  .name == "remote-control-agent" and
                  .version == $version and .target == $target and
                  .artifact_schema == 1 and .device_protocol == 2 and
                  .upgrade_profile == "paired-full-v1" and
                  .upgrade_protocol == null
                ' >/dev/null
            elif [[ "$target" == darwin-* ]]; then
              script="$output/macos-local.sh"
              test -f "$script" && test ! -L "$script"
              script_digest="$(jq -r .macos_script_sha256 "$pin")"
              printf '%s  %s\n' "$script_digest" "$script" | sha256sum --check --status
              grep -Fx "$digest  $filename" "$record" >/dev/null
              grep -Fx "$script_digest  macos-local.sh" "$record" >/dev/null
              tar -xzOf "$archive" bundle.json | jq -e \
                --arg version "$RELEASE_TAG" --arg target "$target" '
                  .name == "remote-control-agent" and
                  .version == $version and .target == $target and
                  .artifact_schema == 1 and .device_protocol == 2 and
                  .receipt_schema == 1 and
                  .candidate_profile == "darwin-permanent-local-v1" and
                  .native_supervisor == "darwin-owned-group-v1" and
                  .upgrade_profile == null and .upgrade_protocol == null
                ' >/dev/null
            else
              grep -Fx "$digest  release-candidate/$target/$filename" "$record" >/dev/null
              tar -xzOf "$archive" bundle.json | jq -e \
                --arg version "$RELEASE_TAG" --arg target "$target" '
                  .name == "remote-control-agent" and
                  .version == $version and .target == $target and
                  .artifact_schema == 1 and .device_protocol == 2 and
                  .receipt_schema == 1 and .upgrade_profile == "paired-full-v1" and
                  .upgrade_protocol == null
                ' >/dev/null
            fi
            cp -- "$archive" "$RUNNER_TEMP/publish/$filename"
          done
          jq -r '.assets[] | "\(.sha256)  \(.name)"' "$pin" > "$RUNNER_TEMP/publish/SHA256SUMS.txt"
          ( cd "$RUNNER_TEMP/publish" && sha256sum --check SHA256SUMS.txt )
          test "$(find "$RUNNER_TEMP/publish" -maxdepth 1 -type f | wc -l)" -eq "$((count+1))"

      - name: Upload draft, re-download/check assets, publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          pin=".github/release-pins/$RELEASE_TAG.json"
          sha="$(jq -r .source_sha "$pin")"
          title="$(jq -r .release_title "$pin")"
          notes="$(jq -r .release_notes "$pin")"
          test -f "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
             [[ -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]]; then
            echo "Release/tag appeared during validation; abort" >&2
            exit 1
          fi
          assets=(
            "$RUNNER_TEMP/publish/remote-control-agent-$RELEASE_TAG-linux-x64-glibc.tar.gz"
            "$RUNNER_TEMP/publish/remote-control-agent-$RELEASE_TAG-linux-arm64-glibc.tar.gz"
            "$RUNNER_TEMP/publish/remote-control-agent-$RELEASE_TAG-windows-x64.zip"
          )
          if [[ "$(jq -r '.assets | length' "$pin")" == 5 ]]; then
            assets+=(
              "$RUNNER_TEMP/publish/remote-control-agent-$RELEASE_TAG-darwin-arm64.tar.gz"
              "$RUNNER_TEMP/publish/remote-control-agent-$RELEASE_TAG-darwin-x64.tar.gz"
            )
          fi
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" "$RUNNER_TEMP/publish/SHA256SUMS.txt" \
            --target "$sha" --title "$title" \
            --notes-file "$notes" --prerelease --draft
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease |
            jq -e '.isDraft == true and .isPrerelease == true' >/dev/null
          mkdir -p "$RUNNER_TEMP/recheck"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/recheck" --clobber
          count="$(jq -r '.assets | length' "$pin")"
          test "$(find "$RUNNER_TEMP/recheck" -maxdepth 1 -type f | wc -l)" -eq "$((count+1))"
          ( cd "$RUNNER_TEMP/recheck" && sha256sum --check SHA256SUMS.txt )
          gh release edit "$RELEASE_TAG" --draft=false
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" |
            jq -e --arg tag "$RELEASE_TAG" '
              .tag_name == $tag and .draft == false and
              .prerelease == true
            ' >/dev/null
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" |
            jq -e --arg sha "$sha" '
              .object.type == "commit" and .object.sha == $sha
            ' >/dev/null
          echo "Verified pinned GitHub prerelease $RELEASE_TAG published; no Worker deployment."
